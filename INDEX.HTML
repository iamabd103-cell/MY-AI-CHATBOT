<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
      padding: 12px 15px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.4;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      🤖 My AI Chatbot
    </div>

    <div class="messages" id="messages">

      <div class="message bot">
        Hello! 👋 Ask me anything.
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>

  <script>

    function sendMessage() {

      const input = document.getElementById("userInput");
      const message = input.value.trim();

      if (message === "") return;

      addMessage(message, "user");

      input.value = "";

      // Temporary reply
      setTimeout(() => {

        addMessage(
          "I received your message! 🤖 AI connection will be added in the next step.",
          "bot"
        );

      }, 500);
    }


    function addMessage(text, type) {

      const messages = document.getElementById("messages");

      const div = document.createElement("div");

      div.className = "message " + type;

      div.textContent = text;

      messages.appendChild(div);

      messages.scrollTop = messages.scrollHeight;
    }

  </script>

</body>
</html>
